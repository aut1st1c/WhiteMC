name: Build WhiteMC

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: WhiteMC-bin-win-x64
            archive: WhiteMC-bin-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            artifact: WhiteMC-bin-linux-x64
            archive: WhiteMC-bin-linux-x64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WhiteMC.csproj

      - name: Build
        run: dotnet build WhiteMC.csproj -c Release --no-restore

      - name: Publish (${{ matrix.rid }}, self-contained)
        run: >
          dotnet publish WhiteMC.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o publish

      - name: Package (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath ${{ matrix.archive }}

      - name: Package (Linux)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          chmod +x publish/WhiteMC
          tar -czvf ${{ matrix.archive }} -C publish .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: |
          echo "=== Скачанные артефакты ==="
          find artifacts -type f -printf '%P  (%s bytes)\n' | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WhiteMC ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/WhiteMC-bin-win-x64.zip
            artifacts/WhiteMC-bin-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}