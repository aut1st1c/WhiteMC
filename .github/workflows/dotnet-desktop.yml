name: Build WhiteMC

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WhiteMC.csproj

      - name: Build
        run: dotnet build WhiteMC.csproj -c Release --no-restore

      - name: Publish (self-contained, win-x64)
        run: >
          dotnet publish WhiteMC.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhiteMC-win-x64
          path: publish/
          if-no-files-found: error
